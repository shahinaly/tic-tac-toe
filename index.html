<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tic-Tac-Toe</h1>
  </header>  
  <div class="meta">
    <h2>Player 1</h2>
    <h2>Player 2</h2>  
    <h2 id="score-1">0</h2>
    <h2 id="score-2">0</h2>
    <h2 id="winner"></h2>
  </div>
  <div class="content">
    <div class="board">
      <h1 class="cell" data-index ="0"></h1>
      <h1 class="cell" data-index ="1"></h1>
      <h1 class="cell" data-index ="2"></h1>
      <h1 class="cell" data-index ="3"></h1>
      <h1 class="cell" data-index ="4"></h1>
      <h1 class="cell" data-index ="5"></h1>
      <h1 class="cell" data-index ="6"></h1>
      <h1 class="cell" data-index ="7"></h1>
      <h1 class="cell" data-index ="8"></h1>
    </div>
    <div>
        <a><button id="#reset" type="button"> Reset </button></a>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
